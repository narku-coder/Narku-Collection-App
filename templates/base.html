<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Narku's Collection{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="min-vh-100 d-flex flex-column">

<header class="app-header border-bottom">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <span class="brand-mark">Narku's</span>
        <span class="fw-semibold">Collection Hub</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('books_list') }}">Books</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('cds_list') }}">CDs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('board_games_list') }}">Board Games</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('video_games_list') }}">Video Games</a>
          </li>
          <li class="nav-item d-none d-md-block">
            <form class="nav-search d-flex align-items-center" action="{{ url_for('global_search') }}" method="get">
                <span class="nav-search-icon">&#128269;</span>
                <input class="form-control form-control-sm nav-search-input"
                    type="search" name="q" placeholder="Search…">
                <select class="form-select form-select-sm nav-search-select ms-2" name="scope">
                    <option value="all" selected>All</option>
                    <option value="books">Books</option>
                    <option value="cds">Cds</option>
                    <option value="board_games">Board Games</option>
                    <option value="video_games">Video Games</option>
                </select>
            </form>
          </li>

          <li class="nav-item ms-lg-3">
            <div class="form-check form-switch text-nowrap theme-toggle">
              <input class="form-check-input" type="checkbox" role="switch"
                     id="themeToggle">
              <label class="form-check-label small" for="themeToggle">
                Dark mode
              </label>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="flex-grow-1">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="container py-3">
        <div class="alert alert-success mb-0">
          {% for m in messages %}{{ m }}<br>{% endfor %}
        </div>
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer class="app-footer border-top py-3 small text-center">
  Internal data console · {{ 2025 }}
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Theme toggle using data-bs-theme + localStorage
  (function () {
    const html = document.documentElement;
    const switchEl = document.getElementById('themeToggle');
    const stored = localStorage.getItem('theme') || 'dark';

    html.setAttribute('data-bs-theme', stored);
    if (switchEl) {
      switchEl.checked = stored === 'dark';

      switchEl.addEventListener('change', function () {
        const mode = this.checked ? 'dark' : 'light';
        html.setAttribute('data-bs-theme', mode);
        localStorage.setItem('theme', mode);
      });
    }
  })();
</script>

</body>
</html>
