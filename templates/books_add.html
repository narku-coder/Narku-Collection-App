{% extends "base.html" %}
{% block title %}Add Book · Narku's Collection Hub{% endblock %}

{% block content %}
<section class="form-wrapper">
  <div class="container form-container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-6">
        <div class="form-card">
          <div class="form-card-header">
            <h1 class="form-title">Add new book</h1>
            <p class="form-subtitle">
              Provide the key details below to create a new book record.
            </p>
          </div>

          <form method="post" class="form-body">
            <div class="form-group mb-3">
              <label class="form-label form-label-lg">Title</label>
              <input type="text" name="title" class="form-control form-input" required>
            </div>
            <div class="form-group mb-3">
              <label class="form-label form-label-lg">Author</label>
              <input type="text" name="author" class="form-control form-input" required>
            </div>
            <div class="form-group mb-4">
              <label class="form-label form-label-lg">Year Published</label>
              <input type="number" step="1" name="year_published"
                     class="form-control form-input" required>
            </div>
            <div class="form-group mb-3">
              <label class="form-label form-label-lg">Publisher</label>
              <input type="text" name="publisher" class="form-control form-input" required>
            </div>
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
              <button class="btn btn-form-primary" name="save_button" type="submit">
                Save book
              </button>
              <a class="btn btn-form-secondary" href="{{ url_for('books_list') }}">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
