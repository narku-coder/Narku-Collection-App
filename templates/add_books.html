{% extends "base.html" %}
{% block title %}Add book · Narku's Collection Console{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Add book</h1>
<p class="text-muted small mb-4">
  Create a new book record in the database.
</p>

<form method="post" class="row g-3 col-12 col-md-8 col-lg-6">
  <div class="col-12">
    <label class="form-label">Title</label>
    <input type="text" name="title" class="form-control" required>
  </div>
  <div class="col-12">
    <label class="form-label">Author</label>
    <input type="text" name="author" class="form-control" required>
  </div>
  <div class="col-12">
    <label class="form-label">Year Published</label>
    <input type="number" name="year_published" class="form-control" min="1" max="2025" required>
  </div>
  <div class="col-12">
    <label class="form-label">Publisher</label>
    <input type="text" name="publisher" class="form-control" required>
  </div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('books_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
